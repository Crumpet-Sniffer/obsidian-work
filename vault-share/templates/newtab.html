{% extends "base.html" %}
{% block title %}New tab{% endblock %}
{% block topbar %}{% endblock %}
{% block body_class %}workspace{% endblock %}
{% block body %}
<div class="app" id="app">
{% include "_sidebar.html" %}
<div class="main">
  <div class="tabbar">
    <button type="button" class="icon-btn tabbar-toggle" data-toggle-sidebar aria-controls="sidebar" aria-label="Toggle sidebar" title="Toggle sidebar"><svg class="ic"><use href="#i-panel-left"/></svg></button>
    <div class="tab is-active">
      <svg class="ic tab-icon"><use href="#i-file"/></svg>
      <span class="tab-title">New tab</span>
      <a class="tab-close" href="/v/{{ vault_id }}" title="Close" aria-label="Close tab"><svg class="ic"><use href="#i-x"/></svg></a>
    </div>
    <a class="icon-btn tab-new" href="/v/{{ vault_id }}/new-tab" title="New tab" aria-label="New tab"><svg class="ic"><use href="#i-plus"/></svg></a>
  </div>
  <div class="view">
    <div class="navbar">
      <button type="button" class="icon-btn" data-history="back" title="Navigate back" aria-label="Navigate back"><svg class="ic"><use href="#i-arrow-left"/></svg></button>
      <button type="button" class="icon-btn" data-history="forward" title="Navigate forward" aria-label="Navigate forward"><svg class="ic"><use href="#i-arrow-right"/></svg></button>
      <div class="view-title">New tab</div>
      <span class="icon-btn spacer"></span>
    </div>
    <div class="view-content">
      <div class="empty-tab">
        <ul class="empty-actions">
          <li><button type="button" class="linklike" data-empty-action="new">Create new note</button></li>
          <li><button type="button" class="linklike" data-empty-action="goto">Go to file</button> <span class="muted">(Ctrl+O)</span></li>
          <li><a href="/v/{{ vault_id }}/graph">Open graph view</a></li>
          <li><button type="button" class="linklike" data-empty-action="close">Close</button></li>
        </ul>
        <h4 class="muted">Recent files</h4>
        <ul class="empty-recent" data-recent></ul>
      </div>
    </div>
  </div>
</div>
</div>
{% endblock %}
