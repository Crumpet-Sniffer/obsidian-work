<aside class="sidebar" id="sidebar" data-vault="{{ vault_id }}"{% if let Some(u) = page.user %} data-csrf="{{ u.csrf }}"{% endif %}>
    <div class="sidebar-top">
    <div class="ribbon-tabs" role="tablist" aria-label="Sidebar">
      <button type="button" class="icon-btn is-active" data-panel="files" title="Files" aria-label="Files"><svg class="ic"><use href="#i-folder"/></svg></button>
      <button type="button" class="icon-btn" data-panel="search" title="Search (Ctrl+Shift+F)" aria-label="Search"><svg class="ic"><use href="#i-search"/></svg></button>
      <button type="button" class="icon-btn" data-panel="bookmarks" title="Bookmarks" aria-label="Bookmarks"><svg class="ic"><use href="#i-bookmark"/></svg></button>
      <a class="icon-btn" href="/v/{{ vault_id }}/graph" title="Graph view" aria-label="Graph view"><svg class="ic"><use href="#i-graph"/></svg></a>
    </div>
    <button type="button" class="icon-btn" data-toggle-sidebar aria-controls="sidebar" aria-label="Collapse sidebar" title="Collapse"><svg class="ic"><use href="#i-panel-left"/></svg></button>
  </div>
  <div class="side-panel" data-panel-body="files">
    <div class="nav-actions">
      <button type="button" class="icon-btn" data-new-note title="New note" aria-label="New note"><svg class="ic"><use href="#i-square-pen"/></svg></button>
      <button type="button" class="icon-btn" data-new-folder title="New folder" aria-label="New folder"><svg class="ic"><use href="#i-folder-plus"/></svg></button>
      <button type="button" class="icon-btn" data-sort title="Change sort order" aria-label="Change sort order"><svg class="ic"><use href="#i-sort"/></svg></button>
      <button type="button" class="icon-btn" data-tree-expand title="Expand all" aria-label="Expand all"><svg class="ic"><use href="#i-expand"/></svg></button>
      <button type="button" class="icon-btn" data-tree-collapse title="Collapse all" aria-label="Collapse all"><svg class="ic"><use href="#i-collapse"/></svg></button>
    </div>
    <nav class="tree" aria-label="Files">
      <details class="tree-root" open>
        <summary>{{ vault_name }}</summary>
        {{ tree_html|safe }}
      </details>
    </nav>
  </div>
  <div class="side-panel" data-panel-body="search" hidden>
    <div class="search-box">
      <input type="search" data-search-input placeholder="Search…" aria-label="Search notes" maxlength="200" autocomplete="off">
      <button type="button" class="icon-btn" data-search-help title="Search operators" aria-label="Search operators">?</button>
    </div>
    <div class="search-ops muted small" data-search-ops hidden>
      <code>file:</code> note name · <code>path:</code> folder · <code>tag:#x</code> tag · <code>content:</code> text only · <code>-word</code> exclude · <code>"exact phrase"</code>
    </div>
    <div class="search-meta muted small" data-search-meta></div>
    <div class="search-results" data-search-results></div>
  </div>
  <div class="side-panel" data-panel-body="bookmarks" hidden>
    <div class="panel-title">Bookmarks</div>
    <ul class="bm-list" data-bookmarks></ul>
  </div>
  <div class="vault-bar">
    <a class="vault-switch" href="/" title="All vaults"><svg class="ic"><use href="#i-updown"/></svg><span>{{ vault_name }}</span></a>
    <a class="icon-btn" href="/" title="Vaults" aria-label="Vaults"><svg class="ic"><use href="#i-help"/></svg></a>
    <a class="icon-btn" href="/account/password" title="Account" aria-label="Account"><svg class="ic"><use href="#i-settings"/></svg></a>
    {% if let Some(u) = page.user %}
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ u.csrf }}">
      <button type="submit" class="icon-btn" title="Sign out ({{ u.username }})" aria-label="Sign out"><svg class="ic"><use href="#i-logout"/></svg></button>
    </form>
    {% endif %}
  </div>
</aside>
