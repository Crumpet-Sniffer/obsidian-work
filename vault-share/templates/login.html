{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body_class %}auth{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Sign in</h1>
  <p class="muted">Shared notes for invited classmates. Ask the owner for an account.</p>
  {% if let Some(e) = error %}<p class="alert error" role="alert">{{ e }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username
      <input name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" maxlength="128" required>
    </label>
    <button type="submit" class="primary">Sign in</button>
  </form>
</section>
{% endblock %}
